<template>
    <template if:false={settingsAccessChecked}>
        <lightning-spinner alternative-text="Checking Panel settings access" size="medium"></lightning-spinner>
    </template>
    <template if:true={hasSettingsAccess}>
    <div class="slds-card slds-p-around_medium bg-slate-50">
        <!-- Header Banner -->
        <div class="slds-page-header slds-page-header_record-home slds-m-bottom_medium slds-box slds-theme_default">
            <div class="slds-page-header__row">
                <div class="slds-page-header__col-title">
                    <div class="slds-media">
                        <div class="slds-media__figure">
                            <lightning-icon icon-name="custom:custom67" size="medium" alternative-text="Panel OAuth"></lightning-icon>
                        </div>
                        <div class="slds-media__body">
                            <div class="slds-page-header__name">
                                <div class="slds-page-header__name-title">
                                    <h1>
                                        <span class="slds-page-header__title slds-truncate" title="TuBot Settings">
                                            TuBot Settings
                                        </span>
                                    </h1>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="slds-page-header__col-actions">
                    <div class="slds-page-header__controls">
                        <div class="slds-page-header__control">
                            <template if:true={isConnected}>
                                <lightning-badge label="Connected to Panel" class="slds-theme_success slds-m-right_x-small"></lightning-badge>
                            </template>
                            <template if:false={isConnected}>
                                <lightning-badge label="Panel login required" class="slds-theme_warning slds-m-right_x-small"></lightning-badge>
                            </template>
                            <template if:true={usesExternalCredentials}>
                                <lightning-badge label="External Credentials Configured" class="slds-theme_shade slds-m-right_x-small text-xs font-mono"></lightning-badge>
                            </template>
                            <template if:false={usesExternalCredentials}>
                                <lightning-badge label="External Credentials Missing" class="slds-theme_error slds-m-right_x-small text-xs font-mono"></lightning-badge>
                            </template>
                            <lightning-button-icon icon-name="utility:refresh" alternative-text="Refresh" onclick={handleRefresh} class="slds-m-left_xx-small"></lightning-button-icon>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <lightning-spinner if:true={isLoading} alternative-text="Loading..." size="medium"></lightning-spinner>

        <lightning-tabset active-tab-value={activeTab} onselect={handleTabSelect}>
            <!-- Tab: Setup Wizard -->
            <lightning-tab label="Setup Wizard" value="wizard" icon-name="utility:setup_assistant_guide">
                <div class="slds-m-top_small">
                    <!-- Simple Setup (recommended): one-click automatic setup -->
                    <article class="slds-card slds-box slds-theme_default slds-m-bottom_medium">
                        <div class="slds-card__header slds-grid">
                            <header class="slds-media slds-media_center slds-has-flexi-truncate">
                                <div class="slds-media__figure">
                                    <lightning-icon icon-name="standard:bot" size="small" alternative-text="Simple Setup"></lightning-icon>
                                </div>
                                <div class="slds-media__body">
                                    <h2 class="slds-card__header-title">
                                        <span class="slds-text-heading_small font-bold">Simple Setup (Recommended)</span>
                                    </h2>
                                    <p class="slds-text-body_small text-gray-500">
                                        One click runs the full setup automatically in this org.
                                    </p>
                                </div>
                                <template if:true={simpleSetupDone}>
                                    <span class="slds-badge slds-theme_success">Completed</span>
                                </template>
                            </header>
                        </div>
                        <div class="slds-card__body slds-card__body_inner">
                            <ul class="slds-list_dotted slds-text-body_small slds-m-bottom_small">
                                <li>Selects the integration user and assigns API access</li>
                                <li>Selects or creates the Messaging Channel and Omni-Queue</li>
                                <li>Prepares integration-user membership and requests approval for the execution app policy</li>
                                <li>Registers the channel and verifies end to end</li>
                            </ul>
                            <template if:true={simpleSetupEcaGuidance}>
                                <div class="slds-box slds-theme_shade slds-m-bottom_small">
                                    <p class="slds-text-body_small"><strong>Approve pre-authorization for {simpleSetupEcaGuidance.appLabel}</strong></p>
                                    <p class="slds-text-body_small slds-m-top_x-small">Salesforce opens its own sign-in and approval popup. Enter your password only on Salesforce. Panel receives a temporary administrator API token in worker request memory to change the app policy to <strong>Admin approved users are pre-authorized</strong> and attach <strong>Tubot_JWT_PreAuth</strong>, preserving existing permission-set attachments. Setup has prepared that permission set and assigned the selected integration user.</p>
                                    <p class="slds-text-body_small slds-m-top_x-small">Panel verifies the change, revokes the temporary token, and discards it. No administrator authorization code, access token, or refresh token is stored. Panel stores the setup outcome and temporarily stores an encrypted PKCE verifier. If you prefer, complete the same policy change manually in Setup.</p>
                                    <div class="slds-m-top_small">
                                        <lightning-button variant="brand" label="Authorize & continue" onclick={handleSimpleSetupAuthorize} disabled={simpleSetupEcaBusy}></lightning-button>
                                        <lightning-button variant="neutral" label="Show manual steps instead" onclick={handleSimpleSetupManual} class="slds-m-left_x-small"></lightning-button>
                                    </div>
                                    <template if:true={simpleSetupEcaManual}>
                                        <ol class="slds-list_ordered slds-text-body_small slds-m-top_small">
                                            <li>Open Salesforce Setup → External Client Apps → External Client App Manager.</li>
                                            <li>Open TuBot Channel API → Policies → Edit.</li>
                                            <li>Set Permitted Users to Admin approved users are pre-authorized and save.</li>
                                            <li>In the app policy permission-set access section, add Tubot_JWT_PreAuth. Keep any existing permission sets.</li>
                                            <li>In Setup → Users → Users, open the selected integration user. Under Permission Set Assignments, confirm Tubot_JWT_PreAuth is assigned.</li>
                                            <li>Return here and re-check. Final registration verifies the policy by obtaining a JWT token as the integration user.</li>
                                        </ol>
                                        <lightning-formatted-url value={simpleSetupEcaGuidance.setupUrl} label="Open External Client Apps in Setup" target="_blank"></lightning-formatted-url>
                                        <div class="slds-m-top_small">
                                            <lightning-button variant="brand" label="Re-check & continue" onclick={handleSimpleSetupRecheck} disabled={simpleSetupEcaBusy}></lightning-button>
                                        </div>
                                    </template>
                                </div>
                            </template>
                            <template if:true={integrationUserOptions.length}>
                                <lightning-combobox
                                    label="Integration user"
                                    value={selectedIntegrationUserId}
                                    options={integrationUserOptions}
                                    onchange={handleIntegrationUserChange}
                                    disabled={simpleSetupRunning}
                                    class="slds-m-bottom_small">
                                </lightning-combobox>
                            </template>
                            <template if:true={messagingChannelOptions.length}>
                                <lightning-combobox
                                    label="Messaging Channel"
                                    value={selectedChannelId}
                                    options={messagingChannelOptions}
                                    onchange={handleChannelChange}
                                    disabled={simpleSetupRunning}
                                    class="slds-m-bottom_small">
                                </lightning-combobox>
                            </template>
                            <template if:false={messagingChannelOptions.length}>
                                <p class="slds-text-body_small slds-m-bottom_small">No Messaging Channel yet — Simple Setup will create one automatically.</p>
                            </template>
                            <lightning-input
                                type="checkbox"
                                label="I understand Simple Setup will create the items above in this org"
                                checked={simpleSetupConsented}
                                onchange={handleSimpleSetupConsent}
                                disabled={simpleSetupRunning}>
                            </lightning-input>
                            <template if:true={simpleSetupSteps.length}>
                                <ul class="slds-m-top_small">
                                    <template for:each={simpleSetupSteps} for:item="step">
                                        <li key={step.key} class="slds-grid slds-grid_vertical-align-center slds-m-bottom_xx-small">
                                            <template if:true={step.showSpinner}>
                                                <lightning-spinner size="small" alternative-text="Running..."></lightning-spinner>
                                            </template>
                                            <template if:false={step.showSpinner}>
                                                <lightning-icon icon-name={step.iconName} size="x-small" alternative-text={step.state}></lightning-icon>
                                            </template>
                                            <span class="slds-m-left_x-small slds-text-body_small"><strong>{step.label}</strong></span>
                                            <template if:true={step.message}>
                                                <span class="slds-m-left_x-small slds-text-body_small text-gray-600">{step.message}</span>
                                            </template>
                                        </li>
                                    </template>
                                </ul>
                            </template>
                            <template if:true={simpleSetupError}>
                                <div class="slds-notify slds-notify_alert slds-alert_error slds-m-top_small" role="alert">
                                    <span>{simpleSetupError}</span>
                                </div>
                            </template>
                            <div class="slds-m-top_small">
                                <lightning-button
                                    variant="brand"
                                    label="Run Simple Setup"
                                    icon-name="utility:play"
                                    onclick={handleSimpleSetupRun}
                                    disabled={simpleSetupRunDisabled}>
                                </lightning-button>
                            </div>
                        </div>
                    </article>

                </div>
            </lightning-tab>

            <!-- Tab: Agent Settings -->
            <lightning-tab label="Agent Settings" value="settings" icon-name="utility:settings">
                <div class="slds-grid slds-gutters slds-wrap slds-m-top_small">
                    <!-- Column: Authentication & Panel Data -->
                    <div class="slds-col slds-size_1-of-1 slds-m-bottom_medium">
                <article class="slds-card slds-box slds-theme_default">
                    <div class="slds-card__header slds-grid">
                        <header class="slds-media slds-media_center slds-has-flexi-truncate">
                            <div class="slds-media__figure">
                                <lightning-icon icon-name="standard:user" size="small"></lightning-icon>
                            </div>
                            <div class="slds-media__body">
                                <h2 class="slds-card__header-title">
                                    <span class="slds-truncate slds-text-heading_small font-bold" onclick={handleRevealPanelEnvironmentToggle}>Panel OAuth Connection</span>
                                </h2>
                            </div>
                        </header>
                    </div>
                    <div class="slds-card__body slds-card__body_inner">
                        <template if:true={showPanelEnvironmentToggle}>
                            <div class="slds-box slds-theme_warning slds-m-bottom_small">
                                <div class="slds-grid slds-wrap slds-grid_align-spread slds-grid_vertical-align-center">
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_8-of-12">
                                        <div class="slds-text-title_bold">Panel and auth environment</div>
                                        <p class="slds-text-body_small">This setting applies to the whole Salesforce org. Switching environments revokes the current Panel session; connect again after the change.</p>
                                    </div>
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12">
                                        <lightning-input type="toggle" label="Use staging Panel and auth" checked={isStagingPanelEnvironment}
                                            message-toggle-active="Staging" message-toggle-inactive="Production"
                                            disabled={isPanelEnvironmentToggleDisabled} onchange={handlePanelEnvironmentToggle}>
                                        </lightning-input>
                                    </div>
                                </div>
                            </div>
                        </template>

                        <!-- Modern External Credentials Panel Environment -->
                        <div class="slds-box slds-box_x-small slds-theme_shade slds-m-bottom_small slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                            <div class="slds-media slds-media_center">
                                <div class="slds-media__figure">
                                    <lightning-icon icon-name="standard:service_territory" size="small"></lightning-icon>
                                </div>
                                <div class="slds-media__body">
                                    <div class="slds-text-body_small slds-text-color_weak font-semibold">{panelEnvironmentLabel} Endpoint</div>
                                    <div class="font-mono text-xs font-bold text-indigo-700">{panelBaseUrl}</div>
                                </div>
                            </div>
                            <div class="slds-no-flex">
                                <span class="slds-badge slds-theme_success font-mono text-xs">callout:{namedCredentialName}</span>
                            </div>
                        </div>

                        <!-- Connected State -->
                        <template if:true={isConnected}>
                            <div class="slds-box slds-theme_shade slds-m-bottom_small">
                                <div class="slds-grid slds-grid_align-spread slds-m-bottom_xx-small">
                                    <span class="slds-text-color_weak slds-text-body_small">User Email:</span>
                                    <span class="slds-text-body_small slds-text-title_bold">{userEmail}</span>
                                </div>
                                <div class="slds-grid slds-grid_align-spread slds-m-bottom_xx-small">
                                    <span class="slds-text-color_weak slds-text-body_small">Active Tenant:</span>
                                    <span class="slds-text-body_small slds-text-title_bold">{teamName}</span>
                                </div>
                                <div class="slds-grid slds-grid_align-spread slds-m-bottom_xx-small">
                                    <span class="slds-text-color_weak slds-text-body_small">Tenant Role:</span>
                                    <span class={roleBadgeClass}>{userRole}</span>
                                </div>
                                <div class="slds-grid slds-grid_align-spread">
                                    <span class="slds-text-color_weak slds-text-body_small">Custom Settings Edit:</span>
                                    <template if:true={canEditSettings}>
                                        <span class="slds-badge slds-theme_success">Granted (edit-salesforce-settings)</span>
                                    </template>
                                    <template if:false={canEditSettings}>
                                        <span class="slds-badge slds-theme_error">Denied (Read-Only)</span>
                                    </template>
                                </div>
                            </div>

                            <div class="slds-m-bottom_medium">
                                <lightning-button variant="destructive-text" label="Disconnect Panel" icon-name="utility:logout" onclick={handleLogout}></lightning-button>
                            </div>


                        </template>

                        <!-- Disconnected State -->
                        <template if:false={isConnected}>
                            <div class="slds-text-align_center slds-m-vertical_medium">
                                <p class="slds-text-color_weak slds-m-bottom_small">
                                    Log in with your Panel account to authorize access to subscription quotas, team roles, and Salesforce channel API management.
                                </p>

                                <template if:true={isPanelCredentialRepairNeeded}>
                                    <div class="slds-notify slds-notify_alert slds-alert_warning slds-m-bottom_small" role="alert">
                                        <span class="slds-assistive-text">Action required</span>
                                        <span>Panel login succeeded, but Salesforce could not save the token. Restore User External Credentials access for this Salesforce admin, then connect again.</span>
                                        <button class="slds-button slds-button_icon slds-notify__close slds-button_icon-inverse" title="Dismiss" onclick={handleDismissPanelCredentialRepair}>
                                            <lightning-icon icon-name="utility:close" alternative-text="Dismiss" size="x-small" variant="inverse"></lightning-icon>
                                        </button>
                                    </div>
                                    <lightning-accordion allow-multiple-sections-open class="slds-m-bottom_medium">
                                        <lightning-accordion-section name="panelCredentialRepair" label="Repair Panel credential access">
                                            <p class="slds-text-body_small slds-m-bottom_x-small">On a workstation with Bun and Salesforce CLI, use the TuBot source checkout. Run this as the same Salesforce admin who uses Panel Settings:</p>
                                            <pre class="slds-box slds-theme_shade slds-text-body_small"><lightning-formatted-text value={panelCredentialRepairCommand}></lightning-formatted-text></pre>
                                            <p class="slds-text-body_small slds-m-top_small">The repair uses Salesforce Metadata REST and cURL to add a small org-local permission set, assigns it only to the currently authenticated Salesforce user, and verifies the access with Salesforce CLI. It does not read, print, or store a Panel token. Return here and click <strong>Connect with Panel</strong> again.</p>
                                            <p class="slds-text-body_small slds-m-top_small">If the script reports the Panel External Credential or Named Credential is missing, upgrade or reinstall TuBot first so Salesforce restores the packaged credential definitions.</p>
                                            <p class="slds-text-body_small slds-m-top_small">Manual option: in Setup, create a permission set, open <strong>Object Settings → User External Credentials</strong>, grant Read, Create, Edit, Delete, and View All, then assign it to this admin.</p>
                                        </lightning-accordion-section>
                                    </lightning-accordion>
                                </template>

                                <!-- Authorizing Progress (fully automatic) -->
                                <template if:true={isAuthorizingOAuth}>
                                    <div class="slds-box slds-m-bottom_medium slds-p-around_medium text-left" style="border: 2px dashed #4f46e5; background: #eef2ff; border-radius: 8px;">
                                        <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_small">
                                            <div class="slds-m-right_small">
                                                <lightning-icon icon-name="utility:sync" size="small" class="slds-icon-text-brand"></lightning-icon>
                                            </div>
                                            <div>
                                                <div class="slds-text-title_bold text-indigo-900 text-sm">
                                                    Connecting to Panel OAuth...
                                                </div>
                                                <div class="slds-text-body_small text-indigo-700">
                                                    Approve access in the popup. This page connects automatically once approved. If you close the popup, use Cancel to stop waiting.
                                                </div>
                                            </div>
                                        </div>
                                        <div class="slds-grid slds-grid_align-end">
                                            <lightning-button variant="neutral" label="Cancel" onclick={handleCancelOAuth} size="small"></lightning-button>
                                        </div>
                                    </div>
                                </template>

                                <div class="slds-grid slds-wrap slds-grid_vertical-align-center">
                                    <lightning-button variant="brand" label="Connect with Panel (PKCE OAuth 2.0)" icon-name="utility:lock" onclick={handleStartOAuth} class="slds-m-bottom_small slds-m-right_x-small"></lightning-button>
                                </div>
                            </div>
                        </template>
                    </div>
                </article>
            </div>
        </div>



    </lightning-tab>

    <lightning-tab label="Messaging Backups" value="setup" icon-name="utility:backup">
        <div class="slds-m-top_small">
            <article class="slds-card slds-box slds-theme_default slds-m-bottom_medium">

                <div class="slds-card__body slds-card__body_inner slds-m-top_medium">
                    <!-- Messaging Configuration Backup & Restore Card -->
                    <div class="slds-box slds-box_small slds-theme_default slds-m-bottom_medium slds-border" data-testid="messaging-backups-section">
                        <!-- Card Header -->
                        <div class="slds-page-header slds-page-header_joined slds-theme_shade slds-box_xx-small slds-m-bottom_small">
                            <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                                <div class="slds-media slds-media_center">
                                    <div class="slds-media__figure">
                                        <lightning-icon icon-name="standard:record_create" size="small"></lightning-icon>
                                    </div>
                                    <div class="slds-media__body">
                                        <div class="slds-grid slds-grid_vertical-align-center">
                                            <h3 class="slds-text-title_bold text-gray-800 text-sm slds-m-right_small">
                                                Messaging Configuration Backups &amp; Restore
                                            </h3>
                                            <span class="slds-badge slds-theme_default font-bold text-xs" data-testid="backups-count-badge">
                                                {backupsCountLabel}
                                            </span>
                                        </div>
                                        <p class="slds-text-body_small slds-text-color_weak text-xxs">
                                            Create and inspect snapshots, or restore a previous configuration. Restore requires a connected Salesforce API authorization.
                                        </p>
                                    </div>
                                </div>
                                <div class="slds-grid slds-grid_vertical-align-center">
                                    <lightning-button
                                        variant="brand-outline"
                                        label="Backup Now"
                                        icon-name="utility:save"
                                        onclick={handleOpenManualBackupModal}
                                        disabled={isBackingUpNow}
                                        size="small"
                                        class="slds-m-right_x-small"
                                        data-testid="backup-now-btn">
                                    </lightning-button>
                                    <lightning-button-icon
                                        icon-name="utility:refresh"
                                        alternative-text="Refresh Backups"
                                        onclick={loadBackups}
                                        disabled={isBackupsLoading}
                                        size="small"
                                        data-testid="refresh-backups-btn">
                                    </lightning-button-icon>
                                </div>
                            </div>
                        </div>

                        <template if:true={canManageSelfOrgApi}>
                            <div class="slds-box slds-theme_default slds-m-bottom_small" data-testid="self-org-api-connection">
                                <div class="slds-grid slds-wrap slds-grid_vertical-align-center slds-grid_align-spread">
                                    <div class="slds-m-right_medium slds-m-bottom_x-small">
                                        <div class="slds-grid slds-grid_vertical-align-center">
                                            <span class="slds-text-title_bold slds-m-right_small">Salesforce API connection</span>
                                            <lightning-badge label={selfOrgConnectionStatusLabel} class={selfOrgConnectionStatusClass}></lightning-badge>
                                        </div>
                                        <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">
                                            PKCE authorization lets package API actions run as the Salesforce user who connects this org. No client secret is stored.
                                        </p>
                                        <template if:true={selfOrgConnectionMessage}>
                                            <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">{selfOrgConnectionMessage}</p>
                                        </template>
                                    </div>
                                    <div class="slds-grid slds-grid_vertical-align-center">
                                        <lightning-button
                                            variant="brand"
                                            label={selfOrgApiActionLabel}
                                            onclick={handleConnectSelfOrgApi}
                                            disabled={selfOrgApiActionDisabled}
                                            class="slds-m-right_x-small"
                                            data-testid="connect-self-org-api-btn">
                                        </lightning-button>
                                        <template if:true={selfOrgConnectionConnected}>
                                            <lightning-button
                                                variant="destructive-text"
                                                label="Disconnect"
                                                onclick={handleDisconnectSelfOrgApi}
                                                disabled={selfOrgDisconnectDisabled}
                                                data-testid="disconnect-self-org-api-btn">
                                            </lightning-button>
                                        </template>
                                    </div>
                                </div>
                                <template if:true={selfOrgConnectionError}>
                                    <div class="slds-notify slds-notify_alert slds-alert_error slds-m-top_small" role="alert">
                                        <span class="slds-assistive-text">Error</span>
                                        <span>{selfOrgConnectionError}</span>
                                    </div>
                                </template>
                                <p class="slds-text-body_small slds-text-color_weak slds-m-top_small">
                                    The Panel-connection client ships in the package: just click Connect and authorize. No setup command, no keys to save.
                                </p>
                            </div>
                        </template>

                        <!-- Backups Table / Spinner / Empty State -->
                        <template if:true={isBackupsLoading}>
                            <div class="slds-p-around_medium slds-text-align_center">
                                <lightning-spinner alternative-text="Loading Backups" size="small" variant="brand"></lightning-spinner>
                                <div class="text-xs text-gray-500 slds-m-top_small">Loading messaging backups...</div>
                            </div>
                        </template>

                        <template if:false={isBackupsLoading}>
                            <template if:true={hasBackups}>
                                <div class="slds-scrollable_x" style="max-height: 280px; overflow-y: auto;">
                                    <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_col-bordered text-xs" data-testid="backups-table">
                                        <thead>
                                            <tr class="slds-line-height_reset bg-gray-50">
                                                <th scope="col" style="width: 14%;"><div class="slds-truncate font-semibold">Reference / Name</div></th>
                                                <th scope="col" style="width: 14%;"><div class="slds-truncate font-semibold">Trigger Type</div></th>
                                                <th scope="col" style="width: 16%;"><div class="slds-truncate font-semibold">Deployment</div></th>
                                                <th scope="col" style="width: 16%;"><div class="slds-truncate font-semibold">Captured At</div></th>
                                                <th scope="col" style="width: 24%;"><div class="slds-truncate font-semibold">Items Snapshot</div></th>
                                                <th scope="col" style="width: 8%;"><div class="slds-truncate font-semibold">Status</div></th>
                                                <th scope="col" style="width: 8%;"><div class="slds-truncate font-semibold slds-text-align_right">Actions</div></th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template for:each={backupsList} for:item="bk">
                                                <tr key={bk.id} class="slds-hint-parent" data-testid={bk.name}>
                                                    <td>
                                                        <div class="font-mono font-bold text-indigo-700">{bk.name}</div>
                                                        <div class="text-xxs text-gray-500 truncate" title={bk.backupName}>{bk.backupName}</div>
                                                    </td>
                                                    <td>
                                                        <span class={bk.triggerBadgeClass}>{bk.triggerType}</span>
                                                    </td>
                                                    <td>
                                                        <div class="font-semibold text-gray-800 truncate" title={bk.deploymentName}>{bk.deploymentName}</div>
                                                    </td>
                                                    <td class="text-gray-600 font-mono text-xxs">
                                                        {bk.createdDate}
                                                    </td>
                                                    <td class="text-gray-700 text-xxs" title={bk.itemSummary}>
                                                        {bk.itemSummary}
                                                    </td>
                                                    <td>
                                                        <span class={bk.statusBadgeClass}>{bk.status}</span>
                                                        <template if:true={bk.isRestored}>
                                                            <div class="text-xxs text-emerald-700 truncate" title={bk.restoredAt}>Restored: {bk.restoredAt}</div>
                                                        </template>
                                                    </td>
                                                    <td class="slds-text-align_right">
                                                        <div class="slds-grid slds-grid_align-end">
                                                            <lightning-button
                                                                variant="brand-outline"
                                                                label="Restore"
                                                                icon-name="utility:undo"
                                                                size="x-small"
                                                                data-id={bk.id}
                                                                onclick={handleOpenRestoreModal}
                                                                disabled={isRestoring}
                                                                class="slds-m-right_xx-small"
                                                                data-testid="restore-btn">
                                                            </lightning-button>
                                                            <lightning-button-icon
                                                                icon-name="utility:preview"
                                                                alternative-text="View Details"
                                                                size="small"
                                                                data-id={bk.id}
                                                                onclick={handleOpenDetailsModal}
                                                                class="slds-m-right_xx-small"
                                                                data-testid="view-backup-btn">
                                                            </lightning-button-icon>
                                                            <lightning-button-icon
                                                                icon-name="utility:delete"
                                                                alternative-text="Delete Backup"
                                                                variant="border-filled"
                                                                size="small"
                                                                data-id={bk.id}
                                                                onclick={handleDeleteBackup}
                                                                data-testid="delete-backup-btn">
                                                            </lightning-button-icon>
                                                        </div>
                                                    </td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </div>
                            </template>

                            <template if:false={hasBackups}>
                                <div class="slds-box slds-theme_shade slds-text-align_center slds-p-around_medium text-xs text-gray-500" data-testid="no-backups-msg">
                                    <lightning-icon icon-name="utility:backup" size="small" class="slds-m-bottom_x-small"></lightning-icon>
                                    <p class="font-semibold text-gray-700">No messaging backups found.</p>
                                    <p class="text-xxs text-gray-500">
                                        Click "Backup Now" to capture the current state.
                                    </p>
                                </div>
                            </template>
                        </template>
                    </div>

                    <!-- Tooling API Setup Log Console -->
                </div>
            </article>
        </div>
    </lightning-tab>
</lightning-tabset>

    <!-- Restore Confirmation Modal -->
    <template if:true={isRestoreModalOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_small" aria-modal="true" data-testid="restore-modal">
            <div class="slds-modal__container">
                <header class="slds-modal__header bg-amber-50" style="border-bottom: 2px solid #f59e0b;">
                    <button class="slds-button slds-button_icon slds-modal__close" title="Close" onclick={handleCloseRestoreModal} disabled={isRestoring}>
                        <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <div class="slds-media slds-media_center">
                        <div class="slds-media__figure">
                            <lightning-icon icon-name="utility:undo" size="medium" variant="warning"></lightning-icon>
                        </div>
                        <div class="slds-media__body">
                            <h2 class="slds-modal__title slds-hyphenate slds-text-heading_medium font-bold text-gray-900">
                                Restore Messaging Configuration
                            </h2>
                            <p class="slds-text-body_small slds-text-color_weak slds-m-top_xxx-small">
                                Backup: <strong>{selectedBackupForRestore.name}</strong> &bull; Trigger: <strong>{selectedBackupForRestore.triggerType}</strong> &bull; Created: {selectedBackupForRestore.createdDate}
                            </p>
                        </div>
                    </div>
                </header>

                <div class="slds-modal__content slds-p-around_medium">
                    <div class="slds-box bg-amber-100 slds-border slds-m-bottom_medium text-amber-900" style="border-color: #f59e0b;">
                        <div class="slds-media slds-media_center">
                            <div class="slds-media__figure">
                                <lightning-icon icon-name="utility:warning" size="small" variant="warning"></lightning-icon>
                            </div>
                            <div class="slds-media__body text-xs font-semibold">
                                Restoring will revert all Messaging Channel routing, Web Chat Custom UI Header components, Agentforce Agent Select mappings, Omni-Channel Queues, and Flow routing links to this backup's snapshot.
                            </div>
                        </div>
                    </div>

                    <div class="slds-box slds-theme_shade slds-m-bottom_medium">
                        <h4 class="font-bold text-gray-800 text-xs slds-m-bottom_xx-small">Snapshot Item Summary:</h4>
                        <div class="text-xs text-gray-700 font-mono slds-m-bottom_xx-small">{selectedBackupForRestore.itemSummary}</div>
                        <template if:true={selectedBackupForRestore.notes}>
                            <div class="text-xxs text-gray-500 italic slds-m-top_xx-small">Notes: {selectedBackupForRestore.notes}</div>
                        </template>
                    </div>

                    <template if:true={isRestoring}>
                        <div class="slds-p-around_medium slds-text-align_center">
                            <lightning-spinner alternative-text="Restoring Snapshot" size="medium" variant="brand"></lightning-spinner>
                            <p class="font-bold text-sm text-indigo-800 slds-m-top_medium">Restoring messaging configurations...</p>
                            <p class="text-xs text-gray-500">Restoring channels, web chat custom components, agent select, queues, and flows...</p>
                        </div>
                    </template>
                </div>

                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" variant="neutral" onclick={handleCloseRestoreModal} disabled={isRestoring} class="slds-m-right_x-small"></lightning-button>
                    <lightning-button label="Confirm &amp; Restore" variant="destructive" icon-name="utility:undo" onclick={handleConfirmRestore} disabled={isRestoring} data-testid="confirm-restore-btn"></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <!-- Backup Details Modal -->
    <template if:true={isDetailsModalOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_medium" aria-modal="true" data-testid="details-modal">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close" title="Close" onclick={handleCloseDetailsModal}>
                        <lightning-icon icon-name="utility:close" size="small" variant="inverse"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 class="slds-modal__title slds-hyphenate slds-text-heading_medium font-bold">
                        Backup Snapshot: {detailsBackupName}
                    </h2>
                    <p class="slds-m-top_x-small slds-text-color_weak slds-text-body_small">
                        {detailsBackupSubName} &bull; Trigger: <strong>{detailsBackupTrigger}</strong> &bull; Captured: <strong>{detailsBackupCreated}</strong>
                    </p>
                </header>

                <div class="slds-modal__content slds-p-around_medium">
                    <template if:true={isDetailsLoading}>
                        <div class="slds-p-around_medium slds-text-align_center">
                            <lightning-spinner alternative-text="Loading Details" size="small"></lightning-spinner>
                        </div>
                    </template>

                    <template if:false={isDetailsLoading}>
                        <!-- Snapshot Component Counts -->
                        <div class="slds-grid slds-gutters slds-wrap slds-m-bottom_medium">
                            <div class="slds-col slds-size_1-of-2 slds-medium-size_2-of-12 slds-m-bottom_small">
                                <div class="slds-box slds-box_x-small slds-text-align_center bg-blue-50 slds-border">
                                    <div class="text-xs text-gray-500 uppercase font-bold">Fields</div>
                                    <div class="text-lg font-bold text-blue-700">{detailsCounts.fields}</div>
                                </div>
                            </div>
                            <div class="slds-col slds-size_1-of-2 slds-medium-size_2-of-12 slds-m-bottom_small">
                                <div class="slds-box slds-box_x-small slds-text-align_center bg-indigo-50 slds-border">
                                    <div class="text-xs text-gray-500 uppercase font-bold">Web Chat</div>
                                    <div class="text-lg font-bold text-indigo-700">{detailsCounts.webChatDeployments}</div>
                                </div>
                            </div>
                            <div class="slds-col slds-size_1-of-2 slds-medium-size_2-of-12 slds-m-bottom_small">
                                <div class="slds-box slds-box_x-small slds-text-align_center bg-emerald-50 slds-border">
                                    <div class="text-xs text-gray-500 uppercase font-bold">Channels</div>
                                    <div class="text-lg font-bold text-emerald-700">{detailsCounts.messagingChannels}</div>
                                </div>
                            </div>
                            <div class="slds-col slds-size_1-of-2 slds-medium-size_2-of-12 slds-m-bottom_small">
                                <div class="slds-box slds-box_x-small slds-text-align_center bg-purple-50 slds-border">
                                    <div class="text-xs text-gray-500 uppercase font-bold">Queues</div>
                                    <div class="text-lg font-bold text-purple-700">{detailsCounts.queues}</div>
                                </div>
                            </div>
                            <div class="slds-col slds-size_1-of-2 slds-medium-size_2-of-12 slds-m-bottom_small">
                                <div class="slds-box slds-box_x-small slds-text-align_center bg-amber-50 slds-border">
                                    <div class="text-xs text-gray-500 uppercase font-bold">Skills</div>
                                    <div class="text-lg font-bold text-amber-700">{detailsCounts.skills}</div>
                                </div>
                            </div>
                            <div class="slds-col slds-size_1-of-2 slds-medium-size_2-of-12 slds-m-bottom_small">
                                <div class="slds-box slds-box_x-small slds-text-align_center bg-rose-50 slds-border">
                                    <div class="text-xs text-gray-500 uppercase font-bold">Flows</div>
                                    <div class="text-lg font-bold text-rose-700">{detailsCounts.flows}</div>
                                </div>
                            </div>
                        </div>

                        <!-- Item Summary -->
                        <div class="slds-box slds-theme_shade slds-m-bottom_medium">
                            <div class="text-xs font-bold text-gray-800 slds-m-bottom_xx-small">Item Summary:</div>
                            <div class="text-xs text-gray-700 font-mono">{detailsBackupItemSummary}</div>
                            <template if:true={hasDetailsBackupNotes}>
                                <div class="text-xxs text-gray-500 italic slds-m-top_xx-small">Notes: {detailsBackupNotes}</div>
                            </template>
                        </div>

                        <!-- Raw JSON Payload View -->
                        <div class="slds-form-element">
                            <div class="slds-grid slds-grid_align-spread slds-m-bottom_xx-small">
                                <label class="slds-form-element__label font-bold text-gray-800">Snapshot JSON Data:</label>
                                <lightning-button-icon icon-name="utility:copy" alternative-text="Copy JSON" size="small" onclick={handleCopyBackupJson}></lightning-button-icon>
                            </div>
                            <div class="slds-box slds-scrollable_y font-mono text-xxs" style="background-color: #0f172a; color: #a5f3fc; max-height: 280px; border-radius: 6px; padding: 12px; white-space: pre-wrap; word-break: break-all;">
                                {rawBackupJson}
                            </div>
                        </div>
                    </template>
                </div>

                <footer class="slds-modal__footer">
                    <lightning-button label="Close" variant="neutral" onclick={handleCloseDetailsModal} class="slds-m-right_x-small"></lightning-button>
                    <lightning-button label="Copy JSON" variant="brand" icon-name="utility:copy" onclick={handleCopyBackupJson}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <!-- Manual Backup Modal -->
    <template if:true={isManualBackupModalOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_small" aria-modal="true" data-testid="manual-backup-modal">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close" title="Close" onclick={handleCloseManualBackupModal}>
                        <lightning-icon icon-name="utility:close" size="small" variant="inverse"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 class="slds-modal__title slds-hyphenate slds-text-heading_medium font-bold">
                        Create Messaging Configuration Backup
                    </h2>
                    <p class="slds-m-top_x-small slds-text-color_weak slds-text-body_small">
                        Captures an immediate snapshot of all MessagingSession fields, web chat deployments, channels, queues, skills, and flows.
                    </p>
                </header>

                <div class="slds-modal__content slds-p-around_medium">
                    <div class="slds-form slds-form_stacked">
                        <lightning-input
                            label="Backup Name"
                            value={manualBackupName}
                            onchange={handleManualBackupNameChange}
                            required
                            class="slds-m-bottom_small"
                            data-testid="manual-backup-name-input">
                        </lightning-input>
                        <lightning-textarea
                            label="Notes (Optional)"
                            value={manualBackupNotes}
                            onchange={handleManualBackupNotesChange}
                            placeholder="e.g. Pre-migration snapshot, test backup, etc."
                            class="slds-m-bottom_small">
                        </lightning-textarea>
                    </div>
                </div>

                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" variant="neutral" onclick={handleCloseManualBackupModal} disabled={isBackingUpNow} class="slds-m-right_x-small"></lightning-button>
                    <lightning-button label="Create Backup" variant="brand" icon-name="utility:save" onclick={handleCreateManualBackup} disabled={isBackingUpNow} data-testid="create-backup-btn"></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>


</div>
    </template>
    <template if:true={settingsAccessChecked}>
        <template if:false={hasSettingsAccess}>
            <section class="slds-card slds-p-around_large slds-text-align_center" role="alert">
                <lightning-icon icon-name="utility:lock" size="medium" alternative-text="Access restricted"></lightning-icon>
                <h1 class="slds-text-heading_medium slds-m-top_small">Panel Agent Settings access is restricted</h1>
                <p class="slds-text-body_regular slds-m-top_small">
                    Ask your Salesforce administrator to assign the Panel Settings Admin Access permission set to your user.
                </p>
            </section>
        </template>
    </template>
</template>
