<template>
    <div class="slds-card slds-p-around_medium bg-slate-50">
        <!-- Header Banner -->
        <div class="slds-page-header slds-page-header_record-home slds-m-bottom_medium slds-box slds-theme_default">
            <div class="slds-page-header__row">
                <div class="slds-page-header__col-title">
                    <div class="slds-media">
                        <div class="slds-media__figure">
                            <lightning-icon icon-name="custom:custom67" size="medium" alternative-text="Panel OAuth"></lightning-icon>
                        </div>
                        <div class="slds-media__body">
                            <div class="slds-page-header__name">
                                <div class="slds-page-header__name-title">
                                    <h1>
                                        <span class="slds-page-header__title slds-truncate" title="Panel OAuth and Salesforce Channel API Settings">
                                            Panel OAuth 2.0 & Channel API Settings
                                        </span>
                                    </h1>
                                </div>
                            </div>
                            <p class="slds-page-header__name-meta">
                                Multi-Tenant Isolation &amp; Channel API Settings
                            </p>
                        </div>
                    </div>
                </div>
                <div class="slds-page-header__col-actions">
                    <div class="slds-page-header__controls">
                        <div class="slds-page-header__control">
                            <template if:true={isConnected}>
                                <lightning-badge label="Connected to Panel" class="slds-theme_success slds-m-right_x-small"></lightning-badge>
                            </template>
                            <template if:false={isConnected}>
                                <lightning-badge label="Panel login required" class="slds-theme_warning slds-m-right_x-small"></lightning-badge>
                            </template>
                            <template if:true={usesExternalCredentials}>
                                <lightning-badge label="External Credentials Configured" class="slds-theme_shade slds-m-right_x-small text-xs font-mono"></lightning-badge>
                            </template>
                            <template if:false={usesExternalCredentials}>
                                <lightning-badge label="External Credentials Missing" class="slds-theme_error slds-m-right_x-small text-xs font-mono"></lightning-badge>
                            </template>
                            <lightning-button-icon icon-name="utility:refresh" alternative-text="Refresh" onclick={handleRefresh} class="slds-m-left_xx-small"></lightning-button-icon>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <lightning-spinner if:true={isLoading} alternative-text="Loading..." size="medium"></lightning-spinner>

        <lightning-tabset active-tab-value={activeTab} onselect={handleTabSelect}>
            <!-- Tab: Setup Wizard -->
            <lightning-tab label="Setup Wizard" value="wizard" icon-name="utility:setup_assistant_guide">
                <div class="slds-m-top_small">
                    <!-- One-Line CLI Post-Install (collapsed: alternative to the guided wizard below) -->
                    <lightning-accordion allow-multiple-sections-open class="slds-m-bottom_medium">
                        <lightning-accordion-section name="cliPostinstall" label="One-Line CLI Post-Install (Specific Org)">
                            <p class="slds-text-body_small text-gray-600 slds-m-bottom_x-small">
                                Run the full interactive post-install from any workstation (Windows, Linux, or macOS) against one specific org — no scratch org is created. The wizard lists your authenticated Salesforce orgs to pick the target, then selects the integration user, selects or creates the Messaging Channel and Omni-Queue, walks through Panel sign-in, provisions the External Client App, registers the channel with Panel, and runs the blind-verification self-test.
                            </p>
                            <p class="slds-text-body_small slds-m-bottom_x-small">
                                <strong>Prerequisites:</strong> Python 3.9+, curl, and Salesforce CLI authenticated to the org (run <code>sf org login web</code> first if the org list is empty).
                            </p>
                            <pre class="slds-box slds-theme_shade slds-text-body_small font-mono" style="white-space: pre-wrap; word-break: break-all;"><lightning-formatted-text value={postinstallCommand}></lightning-formatted-text></pre>
                            <div class="slds-m-top_x-small">
                                <lightning-button variant="neutral" label="Copy Command" icon-name="utility:copy" onclick={handleCopyPostinstallCommand} size="small"></lightning-button>
                            </div>
                            <p class="slds-text-body_small text-gray-600 slds-m-top_x-small">
                                No arguments needed: pick the target org when the wizard lists your authenticated orgs — the script never auto-selects an org. Windows (python.org installs): use <code>python</code> instead of <code>python3</code>; in older PowerShell use <code>curl.exe</code> instead of <code>curl</code>. The installer is served by Panel at <code>{postinstallScriptUrl}</code> and contains no secrets.
                            </p>
                        </lightning-accordion-section>
                    </lightning-accordion>
                    <!-- Progress Indicator -->
                    <div class="slds-box slds-theme_default slds-m-bottom_medium">
                        <lightning-progress-indicator current-step={wizardStep} type="path" variant="base">
                            <lightning-progress-step label="1. Org Health Check" value="health" onclick={handleWizardStepClick}></lightning-progress-step>
                            <lightning-progress-step label="2. Integration User" value="user" onclick={handleWizardStepClick}></lightning-progress-step>
                            <lightning-progress-step label="3. External Client App" value="eca" onclick={handleWizardStepClick}></lightning-progress-step>
                            <lightning-progress-step label="4. Connect & Verify" value="connect" onclick={handleWizardStepClick}></lightning-progress-step>
                        </lightning-progress-indicator>
                    </div>

                    <!-- STEP 1: Org Health Check -->
                    <template if:true={isWizardStepHealth}>
                        <article class="slds-card slds-box slds-theme_default">
                            <div class="slds-card__header slds-grid">
                                <header class="slds-media slds-media_center slds-has-flexi-truncate">
                                    <div class="slds-media__figure">
                                        <lightning-icon icon-name="standard:service_crew" size="small"></lightning-icon>
                                    </div>
                                    <div class="slds-media__body">
                                        <h2 class="slds-card__header-title">
                                            <span class="slds-text-heading_small font-bold">Step 1: Org Readiness &amp; Permissions Health Check</span>
                                        </h2>
                                        <p class="slds-text-body_small text-gray-500">
                                            Verifies Salesforce org prerequisites, packaged permission sets, license availability, and Panel OAuth grounding.
                                        </p>
                                    </div>
                                </header>
                            </div>
                            <div class="slds-card__body slds-card__body_inner">
                                <template if:true={isWizardHealthLoading}>
                                    <lightning-spinner alternative-text="Checking health..." size="small"></lightning-spinner>
                                </template>
                                <template if:false={isWizardHealthLoading}>
                                    <template if:true={wizardHealth}>
                                        <div class="slds-grid slds-gutters slds-wrap">
                                            <!-- Card 1: External Client Apps -->
                                            <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-m-bottom_small">
                                                <div class="slds-box slds-theme_shade slds-p-around_small">
                                                    <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                                                        <div>
                                                            <div class="font-bold">External Client Apps (ECA)</div>
                                                            <div class="slds-text-body_small text-gray-600">Salesforce OAuth 2.0 Inbound Standard</div>
                                                        </div>
                                                        <template if:true={wizardHealth.isEcaAvailable}>
                                                            <span class="slds-badge slds-theme_success">Available</span>
                                                        </template>
                                                        <template if:false={wizardHealth.isEcaAvailable}>
                                                            <span class="slds-badge slds-theme_warning">Check Setup</span>
                                                        </template>
                                                    </div>
                                                </div>
                                            </div>

                                            <!-- Card 2: Panel OAuth Session -->
                                            <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-m-bottom_small">
                                                <div class="slds-box slds-theme_shade slds-p-around_small">
                                                    <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                                                        <div>
                                                            <div class="font-bold">Panel OAuth Connection</div>
                                                            <div class="slds-text-body_small text-gray-600">{wizardHealth.panelTeamName}</div>
                                                        </div>
                                                        <template if:true={wizardHealth.isPanelConnected}>
                                                            <span class="slds-badge slds-theme_success">Connected</span>
                                                        </template>
                                                        <template if:false={wizardHealth.isPanelConnected}>
                                                            <span class="slds-badge slds-theme_warning">Login Required</span>
                                                        </template>
                                                    </div>
                                                </div>
                                            </div>

                                            <!-- Card 3: Packaged Permission Sets -->
                                            <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-m-bottom_small">
                                                <div class="slds-box slds-theme_shade slds-p-around_small">
                                                    <div class="font-bold slds-m-bottom_xx-small">Packaged Permission Sets</div>
                                                    <div class="slds-grid slds-grid_align-spread slds-m-bottom_xx-small">
                                                        <span class="slds-text-body_small">Tubot_Salesforce_API_Read:</span>
                                                        <template if:true={wizardHealth.hasApiReadPermissionSet}>
                                                            <span class="slds-badge slds-theme_success">Installed</span>
                                                        </template>
                                                        <template if:false={wizardHealth.hasApiReadPermissionSet}>
                                                            <span class="slds-badge slds-theme_error">Missing</span>
                                                        </template>
                                                    </div>
                                                    <div class="slds-grid slds-grid_align-spread">
                                                        <span class="slds-text-body_small">Panel_Settings_Admin_Access:</span>
                                                        <template if:true={wizardHealth.hasSettingsAdminPermissionSet}>
                                                            <span class="slds-badge slds-theme_success">Installed</span>
                                                        </template>
                                                        <template if:false={wizardHealth.hasSettingsAdminPermissionSet}>
                                                            <span class="slds-badge slds-theme_error">Missing</span>
                                                        </template>
                                                    </div>
                                                </div>
                                            </div>

                                            <!-- Card 4: Salesforce Integration Licenses -->
                                            <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-m-bottom_small">
                                                <div class="slds-box slds-theme_shade slds-p-around_small">
                                                    <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                                                        <div>
                                                            <div class="font-bold">Integration User Licenses</div>
                                                            <div class="slds-text-body_small text-gray-600">
                                                                Available: <strong>{wizardHealth.availableIntegrationLicenses}</strong> / Total: {wizardHealth.totalIntegrationLicenses}
                                                            </div>
                                                        </div>
                                                        <span class="slds-badge slds-theme_default">{wizardHealth.availableIntegrationLicenses} Free</span>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </template>

                                    <div class="slds-notify slds-notify_alert slds-alert_info slds-m-top_small" role="alert">
                                        <span class="slds-assistive-text">AppExchange Compliance Notice</span>
                                        <span>
                                            <strong>AppExchange Zero-Trust Architecture:</strong> Salesforce requires that External Client App policies and execution users be explicitly approved and configured by an administrator. This wizard helps you configure least-privilege API access without sharing passwords or global administrative profiles.
                                        </span>
                                    </div>

                                    <div class="slds-m-top_medium slds-text-align_right">
                                        <lightning-button variant="brand" label="Next: Select Integration User" icon-name="utility:forward" icon-position="right" onclick={handleWizardGoToUser}></lightning-button>
                                    </div>
                                </template>
                            </div>
                        </article>
                    </template>

                    <!-- STEP 2: Integration User Selection & Role Validation -->
                    <template if:true={isWizardStepUser}>
                        <article class="slds-card slds-box slds-theme_default">
                            <div class="slds-card__header slds-grid">
                                <header class="slds-media slds-media_center slds-has-flexi-truncate">
                                    <div class="slds-media__figure">
                                        <lightning-icon icon-name="standard:user" size="small"></lightning-icon>
                                    </div>
                                    <div class="slds-media__body">
                                        <h2 class="slds-card__header-title">
                                            <span class="slds-text-heading_small font-bold">Step 2: Integration User Selection &amp; Permission Assignment</span>
                                        </h2>
                                        <p class="slds-text-body_small text-gray-500">
                                            Select a dedicated Integration User for API execution. The package will assign <code>Tubot_Salesforce_API_Read</code>.
                                        </p>
                                    </div>
                                </header>
                            </div>
                            <div class="slds-card__body slds-card__body_inner">
                                <div class="slds-form-element slds-m-bottom_medium">
                                    <lightning-combobox
                                        label="Select Integration User in Org"
                                        placeholder="Choose an active user..."
                                        value={selectedWizardUserId}
                                        options={wizardUserOptions}
                                        onchange={handleWizardSelectUser}>
                                    </lightning-combobox>
                                </div>

                                <template if:true={selectedWizardUser}>
                                    <div class="slds-box slds-theme_shade slds-m-bottom_medium">
                                        <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_x-small">
                                            <div>
                                                <h3 class="font-bold text-sm">{selectedWizardUser.name}</h3>
                                                <div class="font-mono text-xs text-gray-600">{selectedWizardUser.username}</div>
                                            </div>
                                            <template if:true={selectedWizardUser.isIntegrationProfile}>
                                                <span class="slds-badge slds-theme_success">Dedicated Integration Profile</span>
                                            </template>
                                        </div>
                                        <div class="slds-grid slds-grid_align-spread slds-m-bottom_x-small text-xs">
                                            <span class="text-gray-500">Profile:</span>
                                            <span class="font-semibold">{selectedWizardUser.profileName}</span>
                                        </div>
                                        <div class="slds-grid slds-grid_align-spread slds-m-bottom_x-small text-xs">
                                            <span class="text-gray-500">User ID:</span>
                                            <span class="font-mono">{selectedWizardUser.id}</span>
                                        </div>
                                        <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-p-top_x-small slds-border_top">
                                            <div>
                                                <span class="text-xs text-gray-600">Tubot API Read Permission Set: </span>
                                                <template if:true={selectedWizardUser.hasApiPermission}>
                                                    <span class="slds-badge slds-theme_success font-bold">Assigned</span>
                                                </template>
                                                <template if:false={selectedWizardUser.hasApiPermission}>
                                                    <span class="slds-badge slds-theme_warning">Not Assigned</span>
                                                </template>
                                            </div>
                                            <template if:false={selectedWizardUser.hasApiPermission}>
                                                <lightning-button
                                                    variant="brand-outline"
                                                    label="Assign Tubot API Permission Set"
                                                    icon-name="utility:shield"
                                                    onclick={handleWizardAssignPermission}
                                                    disabled={isAssigningPermission}>
                                                </lightning-button>
                                            </template>
                                        </div>
                                    </div>
                                </template>

                                <div class="slds-grid slds-grid_align-spread slds-m-top_medium">
                                    <lightning-button label="Back" icon-name="utility:back" onclick={handleWizardGoToHealth}></lightning-button>
                                    <lightning-button variant="brand" label="Next: External Client App Setup" icon-name="utility:forward" icon-position="right" onclick={handleWizardGoToEca} disabled={wizardNextFromUserDisabled}></lightning-button>
                                </div>
                            </div>
                        </article>
                    </template>

                    <!-- STEP 3: External Client App Setup -->
                    <template if:true={isWizardStepEca}>
                        <article class="slds-card slds-box slds-theme_default">
                            <div class="slds-card__header slds-grid">
                                <header class="slds-media slds-media_center slds-has-flexi-truncate">
                                    <div class="slds-media__figure">
                                        <lightning-icon icon-name="standard:connected_apps" size="small"></lightning-icon>
                                    </div>
                                    <div class="slds-media__body">
                                        <h2 class="slds-card__header-title">
                                            <span class="slds-text-heading_small font-bold">Step 3: External Client App (ECA) Policy &amp; OAuth Setup</span>
                                        </h2>
                                        <p class="slds-text-body_small text-gray-500">
                                            Configure a Local External Client App in Salesforce Setup using the parameters below.
                                        </p>
                                    </div>
                                </header>
                            </div>
                            <div class="slds-card__body slds-card__body_inner">
                                <template if:true={wizardEcaGuidance}>
                                    <div class="slds-box slds-theme_shade slds-m-bottom_medium">
                                        <h3 class="font-bold text-xs uppercase tracking-wider text-gray-700 slds-m-bottom_small">Required ECA Parameters (AppExchange Grounded)</h3>
                                        <div class="slds-grid slds-gutters slds-wrap text-xs">
                                            <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-m-bottom_x-small">
                                                <span class="text-gray-500">App Name:</span>
                                                <span class="font-mono font-bold block">{wizardEcaGuidance.recommendedAppName}</span>
                                            </div>
                                            <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-m-bottom_x-small">
                                                <span class="text-gray-500">OAuth Scopes:</span>
                                                <span class="font-mono font-bold block">{wizardEcaGuidance.requiredScopes}</span>
                                            </div>
                                            <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-m-bottom_x-small">
                                                <span class="text-gray-500">OAuth Flow:</span>
                                                <span class="font-bold block">{wizardEcaGuidance.oauthFlow}</span>
                                            </div>
                                            <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-m-bottom_x-small">
                                                <span class="text-gray-500">Run As Integration User:</span>
                                                <span class="font-mono font-bold text-indigo-700 block">{selectedWizardUserUsername}</span>
                                            </div>
                                        </div>
                                    </div>
                                </template>

                                <div class="slds-box slds-box_x-small slds-theme_default slds-m-bottom_medium">
                                    <ol class="slds-list_ordered slds-text-body_small slds-m-left_medium">
                                        <li class="slds-m-bottom_xx-small">Click the button below to open <strong>External Client App Manager</strong> in Salesforce Setup.</li>
                                        <li class="slds-m-bottom_xx-small">Click <strong>New Local External Client App</strong> and enter name <code>Tubot_SF_Channel_API</code>.</li>
                                        <li class="slds-m-bottom_xx-small">Enable OAuth Settings, select scopes <code>api</code> and <code>openid</code>, and enable <strong>Client Credentials Flow</strong>.</li>
                                        <li class="slds-m-bottom_xx-small">In OAuth Policies, set <strong>Run As</strong> to <code>{selectedWizardUserUsername}</code>.</li>
                                        <li>Copy the Consumer Key and Consumer Secret, then proceed to Step 4.</li>
                                    </ol>
                                    <div class="slds-m-top_small">
                                        <lightning-button
                                            label="Open External Client App Manager"
                                            icon-name="utility:new_window"
                                            onclick={handleOpenEcaSetup}>
                                        </lightning-button>
                                    </div>
                                </div>

                                <div class="slds-grid slds-grid_align-spread slds-m-top_medium">
                                    <lightning-button label="Back" icon-name="utility:back" onclick={handleWizardGoToUser}></lightning-button>
                                    <lightning-button variant="brand" label="Next: Connect &amp; Verify Channel" icon-name="utility:forward" icon-position="right" onclick={handleWizardGoToConnect}></lightning-button>
                                </div>
                            </div>
                        </article>
                    </template>

                    <!-- STEP 4: Connect Channel & End-to-End Verification -->
                    <template if:true={isWizardStepConnect}>
                        <article class="slds-card slds-box slds-theme_default">
                            <div class="slds-card__header slds-grid">
                                <header class="slds-media slds-media_center slds-has-flexi-truncate">
                                    <div class="slds-media__figure">
                                        <lightning-icon icon-name="standard:record_create" size="small"></lightning-icon>
                                    </div>
                                    <div class="slds-media__body">
                                        <h2 class="slds-card__header-title">
                                            <span class="slds-text-heading_small font-bold">Step 4: Register &amp; Verify Channel API Credentials</span>
                                        </h2>
                                        <p class="slds-text-body_small text-gray-500">
                                            Register the ECA credentials for your Messaging Channel to enable secure, channel-scoped tool execution.
                                        </p>
                                    </div>
                                </header>
                            </div>
                            <div class="slds-card__body slds-card__body_inner">
                                <template if:true={wizardConnectSuccess}>
                                    <div class="slds-notify slds-notify_alert slds-alert_success slds-m-bottom_medium" role="alert">
                                        <span class="slds-assistive-text">Success</span>
                                        <span>
                                            🎉 <strong>Setup Complete!</strong> The channel API credentials have been verified and securely registered with Panel. The integration user and External Client App are fully grounded.
                                        </span>
                                    </div>
                                </template>

                                <div class="slds-form slds-form_stacked slds-m-bottom_medium">
                                    <lightning-combobox
                                        label="Target Messaging Channel"
                                        value={wizardSelectedChannelId}
                                        options={messagingChannelOptions}
                                        onchange={handleWizardChannelChange}
                                        placeholder="Select channel...">
                                    </lightning-combobox>

                                    <div class="slds-form-element slds-m-top_small">
                                        <label class="slds-form-element__label">Selected Integration User</label>
                                        <div class="slds-form-element__control">
                                            <div class="slds-box slds-box_x-small slds-theme_shade font-mono text-xs">
                                                {selectedWizardUserDisplayName}
                                            </div>
                                        </div>
                                    </div>

                                    <lightning-input
                                        class="slds-m-top_small"
                                        label="External Client App Consumer Key"
                                        value={wizardClientId}
                                        onchange={handleWizardClientIdChange}
                                        placeholder="Enter ECA Consumer Key (Client ID)...">
                                    </lightning-input>

                                    <lightning-input
                                        class="slds-m-top_small"
                                        type="password"
                                        label="External Client App Consumer Secret"
                                        value={wizardClientSecret}
                                        onchange={handleWizardClientSecretChange}
                                        placeholder="Enter ECA Consumer Secret...">
                                    </lightning-input>

                                    <div class="slds-m-top_medium">
                                        <lightning-button
                                            variant="brand"
                                            label="Connect &amp; Verify Channel API"
                                            icon-name="utility:link"
                                            onclick={handleWizardConnectChannel}
                                            disabled={wizardConnectDisabled}>
                                        </lightning-button>
                                    </div>
                                </div>

                                <div class="slds-grid slds-grid_align-spread slds-m-top_medium slds-border_top slds-p-top_small">
                                    <lightning-button label="Back" icon-name="utility:back" onclick={handleWizardGoToEca}></lightning-button>
                                    <lightning-button variant="neutral" label="Restart Wizard" icon-name="utility:refresh" onclick={handleWizardRestart}></lightning-button>
                                </div>
                            </div>
                        </article>
                    </template>
                </div>
            </lightning-tab>

            <!-- Tab: Agent Settings -->
            <lightning-tab label="Agent Settings" value="settings" icon-name="utility:settings">
                <div class="slds-grid slds-gutters slds-wrap slds-m-top_small">
                    <!-- Column: Authentication & Panel Data -->
                    <div class="slds-col slds-size_1-of-1 slds-m-bottom_medium">
                <article class="slds-card slds-box slds-theme_default">
                    <div class="slds-card__header slds-grid">
                        <header class="slds-media slds-media_center slds-has-flexi-truncate">
                            <div class="slds-media__figure">
                                <lightning-icon icon-name="standard:user" size="small"></lightning-icon>
                            </div>
                            <div class="slds-media__body">
                                <h2 class="slds-card__header-title">
                                    <span class="slds-truncate slds-text-heading_small font-bold">Panel OAuth Connection</span>
                                </h2>
                            </div>
                        </header>
                    </div>
                    <div class="slds-card__body slds-card__body_inner">
                        <!-- Modern External Credentials Production Endpoint -->
                        <div class="slds-box slds-box_x-small slds-theme_shade slds-m-bottom_small slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                            <div class="slds-media slds-media_center">
                                <div class="slds-media__figure">
                                    <lightning-icon icon-name="standard:service_territory" size="small"></lightning-icon>
                                </div>
                                <div class="slds-media__body">
                                    <div class="slds-text-body_small slds-text-color_weak font-semibold">Production Endpoint</div>
                                    <div class="font-mono text-xs font-bold text-indigo-700">{panelBaseUrl}</div>
                                </div>
                            </div>
                            <div class="slds-no-flex">
                                <span class="slds-badge slds-theme_success font-mono text-xs">callout:{namedCredentialName}</span>
                            </div>
                        </div>

                        <!-- Connected State -->
                        <template if:true={isConnected}>
                            <div class="slds-box slds-theme_shade slds-m-bottom_small">
                                <div class="slds-grid slds-grid_align-spread slds-m-bottom_xx-small">
                                    <span class="slds-text-color_weak slds-text-body_small">User Email:</span>
                                    <span class="slds-text-body_small slds-text-title_bold">{userEmail}</span>
                                </div>
                                <div class="slds-grid slds-grid_align-spread slds-m-bottom_xx-small">
                                    <span class="slds-text-color_weak slds-text-body_small">Active Tenant:</span>
                                    <span class="slds-text-body_small slds-text-title_bold">{teamName}</span>
                                </div>
                                <div class="slds-grid slds-grid_align-spread slds-m-bottom_xx-small">
                                    <span class="slds-text-color_weak slds-text-body_small">Tenant Role:</span>
                                    <span class={roleBadgeClass}>{userRole}</span>
                                </div>
                                <div class="slds-grid slds-grid_align-spread">
                                    <span class="slds-text-color_weak slds-text-body_small">Custom Settings Edit:</span>
                                    <template if:true={canEditSettings}>
                                        <span class="slds-badge slds-theme_success">Granted (edit-salesforce-settings)</span>
                                    </template>
                                    <template if:false={canEditSettings}>
                                        <span class="slds-badge slds-theme_error">Denied (Read-Only)</span>
                                    </template>
                                </div>
                            </div>

                            <div class="slds-m-bottom_medium">
                                <lightning-button variant="destructive-text" label="Disconnect Panel" icon-name="utility:logout" onclick={handleLogout}></lightning-button>
                            </div>

                            <!-- Technical rows + live Panel data, collapsed by default -->
                            <lightning-accordion allow-multiple-sections-open class="slds-m-bottom_medium">
                                <lightning-accordion-section name="connectionDetails" label="Connection details">
                                    <div class="slds-grid slds-grid_align-spread slds-m-bottom_xx-small">
                                        <span class="slds-text-color_weak slds-text-body_small">OAuth Protocol:</span>
                                        <span class="slds-badge slds-theme_success font-bold">PKCE S256 (No Client Secrets)</span>
                                    </div>
                                    <div class="slds-grid slds-grid_align-spread slds-m-bottom_xx-small">
                                        <span class="slds-text-color_weak slds-text-body_small">Named Credential:</span>
                                        <span class="font-mono text-xs font-bold text-indigo-700">callout:{namedCredentialName}</span>
                                    </div>
                                    <div class="slds-grid slds-grid_align-spread slds-m-bottom_small">
                                        <span class="slds-text-color_weak slds-text-body_small">External Credential:</span>
                                        <span class="font-mono text-xs text-gray-700">{externalCredentialName}</span>
                                    </div>
                                    <lightning-button variant="brand-outline" label="Inspect Panel APIs" icon-name="utility:preview" onclick={handleTogglePanelData}></lightning-button>
                                    <template if:true={showPanelData}>
                                        <div class="slds-box slds-m-top_small bg-white">
                                            <lightning-tabset>
                                                <lightning-tab label="Subscription" icon-name="utility:money">
                                                    <template if:true={subscriptionData}>
                                                        <div class="slds-m-around_x-small text-xs space-y-1">
                                                            <div><strong>Plan:</strong> {subscriptionData.subscription.planName} ({subscriptionData.subscription.status})</div>
                                                            <div><strong>Credit Balance:</strong> {subscriptionData.subscription.purchasedCreditBalance}</div>
                                                            <div><strong>Seats:</strong> {subscriptionData.subscription.limits.teamSeats}</div>
                                                            <div class="slds-m-top_x-small text-muted text-gray-500">
                                                                Protected API endpoint: <code>GET /api/v1/subscription</code> via <code>callout:{namedCredentialName}</code>
                                                            </div>
                                                        </div>
                                                    </template>
                                                    <template if:false={subscriptionData}>
                                                        <lightning-button label="Load Subscription" onclick={handleLoadSubscription} size="small"></lightning-button>
                                                    </template>
                                                </lightning-tab>
                                                <lightning-tab label="Team Members" icon-name="utility:groups">
                                                    <template if:true={teamMembersData}>
                                                        <ul class="slds-has-dividers_bottom slds-m-around_x-small text-xs">
                                                            <template for:each={teamMembersData.members} for:item="m">
                                                                <li key={m.id} class="slds-item slds-p-vertical_xx-small">
                                                                    <strong>{m.name}</strong> ({m.email}) - <span class="slds-badge">{m.role}</span>
                                                                </li>
                                                            </template>
                                                        </ul>
                                                    </template>
                                                    <template if:false={teamMembersData}>
                                                        <lightning-button label="Load Team Members" onclick={handleLoadTeamMembers} size="small"></lightning-button>
                                                    </template>
                                                </lightning-tab>
                                            </lightning-tabset>
                                        </div>
                                    </template>
                                </lightning-accordion-section>
                            </lightning-accordion>
                        </template>

                        <!-- Disconnected State -->
                        <template if:false={isConnected}>
                            <div class="slds-text-align_center slds-m-vertical_medium">
                                <div class="slds-box slds-box_x-small slds-theme_shade slds-m-bottom_small" style="border-left: 4px solid #4f46e5;">
                                    <div class="slds-text-title_bold text-indigo-700 slds-m-bottom_xx-small">
                                        🛡️ Modern Salesforce External Credentials Framework
                                    </div>
                                    <p class="slds-text-body_small text-gray-600">
                                        Panel login uses OAuth 2.0 PKCE (S256) with a Client ID and no client secret. Its token is secured in <code>{externalCredentialName}</code> and calls route via <code>callout:{namedCredentialName}</code>. Channel API setup uses a separate ECA consumer secret sent once to Panel.
                                    </p>
                                </div>
                                <p class="slds-text-color_weak slds-m-bottom_small">
                                    Log in with your Panel account to authorize access to subscription quotas, team roles, and Salesforce channel API management.
                                </p>

                                <template if:true={isPanelCredentialRepairNeeded}>
                                    <div class="slds-notify slds-notify_alert slds-alert_warning slds-m-bottom_small" role="alert">
                                        <span class="slds-assistive-text">Action required</span>
                                        <span>Panel login succeeded, but Salesforce could not save the token. Restore User External Credentials access for this Salesforce admin, then connect again.</span>
                                        <button class="slds-button slds-button_icon slds-notify__close slds-button_icon-inverse" title="Dismiss" onclick={handleDismissPanelCredentialRepair}>
                                            <lightning-icon icon-name="utility:close" alternative-text="Dismiss" size="x-small" variant="inverse"></lightning-icon>
                                        </button>
                                    </div>
                                    <lightning-accordion allow-multiple-sections-open class="slds-m-bottom_medium">
                                        <lightning-accordion-section name="panelCredentialRepair" label="Repair Panel credential access">
                                            <p class="slds-text-body_small slds-m-bottom_x-small">On a workstation with Bun and Salesforce CLI, use the TuBot source checkout. Run this as the same Salesforce admin who uses Panel Settings:</p>
                                            <pre class="slds-box slds-theme_shade slds-text-body_small"><lightning-formatted-text value={panelCredentialRepairCommand}></lightning-formatted-text></pre>
                                            <p class="slds-text-body_small slds-m-top_small">The repair uses Salesforce Metadata REST and cURL to add a small org-local permission set, assigns it only to the currently authenticated Salesforce user, and verifies the access with Salesforce CLI. It does not read, print, or store a Panel token. Return here and click <strong>Connect with Panel</strong> again.</p>
                                            <p class="slds-text-body_small slds-m-top_small">If the script reports the Panel External Credential or Named Credential is missing, upgrade or reinstall TuBot first so Salesforce restores the packaged credential definitions.</p>
                                            <p class="slds-text-body_small slds-m-top_small">Manual option: in Setup, create a permission set, open <strong>Object Settings → User External Credentials</strong>, grant Read, Create, Edit, Delete, and View All, then assign it to this admin.</p>
                                            <div class="slds-border_top slds-m-top_medium slds-p-top_small">
                                                <p class="slds-text-title_bold">Restore the Salesforce API ECA</p>
                                                <p class="slds-text-body_small slds-m-vertical_x-small">The PKCE Salesforce API app is separate from Panel token storage. From the TuBot source checkout, run this as a Salesforce admin to recreate it and save its consumer key:</p>
                                                <pre class="slds-box slds-theme_shade slds-text-body_small"><lightning-formatted-text value={selfOrgSetupCommand}></lightning-formatted-text></pre>
                                                <p class="slds-text-body_small slds-m-top_x-small">It uses PKCE without a client secret. Salesforce API connection instructions also appear in this tab after Panel connects.</p>
                                            </div>
                                        </lightning-accordion-section>
                                    </lightning-accordion>
                                </template>

                                <!-- Authorizing Progress & Manual Code Fallback -->
                                <template if:true={isAuthorizingOAuth}>
                                    <div class="slds-box slds-m-bottom_medium slds-p-around_medium text-left" style="border: 2px dashed #4f46e5; background: #eef2ff; border-radius: 8px;">
                                        <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_small">
                                            <div class="slds-m-right_small">
                                                <lightning-icon icon-name="utility:sync" size="small" class="slds-icon-text-brand"></lightning-icon>
                                            </div>
                                            <div>
                                                <div class="slds-text-title_bold text-indigo-900 text-sm">
                                                    Connecting to Panel OAuth...
                                                </div>
                                                <div class="slds-text-body_small text-indigo-700">
                                                    Approve access in the popup. This page connects automatically when the popup returns; if it stays open, check authorization or enter the code below.
                                                </div>
                                            </div>
                                        </div>
                                        <div class="slds-grid slds-gutters slds-grid_vertical-align-center">
                                            <div class="slds-col slds-size_8-of-12">
                                                <lightning-input label="Manual Authorization Code Fallback" placeholder="Paste pnl_code_... here if needed" value={manualCodeInput} onchange={handleManualCodeChange} variant="label-hidden"></lightning-input>
                                            </div>
                                            <div class="slds-col slds-size_4-of-12 slds-grid slds-grid_align-end">
                                                <lightning-button variant="neutral" label="Check Authorization" onclick={handleCheckOAuth} disabled={isCheckingOAuth} class="slds-m-right_xx-small" size="small"></lightning-button>
                                                <lightning-button variant="brand" label="Submit Code" onclick={handleManualCodeSubmit} class="slds-m-right_xx-small" size="small"></lightning-button>
                                                <lightning-button variant="neutral" label="Cancel" onclick={handleCancelOAuth} size="small"></lightning-button>
                                            </div>
                                        </div>
                                    </div>
                                </template>

                                <div class="slds-grid slds-wrap slds-grid_vertical-align-center">
                                    <lightning-button variant="brand" label="Connect with Panel (PKCE OAuth 2.0)" icon-name="utility:lock" onclick={handleStartOAuth} class="slds-m-bottom_small slds-m-right_x-small"></lightning-button>
                                    <lightning-button variant="neutral" label="Connect with Different Account" icon-name="utility:switch" onclick={handleStartOAuthDifferentAccount} class="slds-m-bottom_small"></lightning-button>
                                </div>
                            </div>
                        </template>
                    </div>
                </article>
            </div>
        </div>

        <template if:true={isConnected}>
            <article class="slds-card slds-box slds-theme_default slds-m-top_medium">
                <h2 class="slds-text-heading_small slds-m-bottom_small">Salesforce API access by Messaging Channel</h2>
                <p class="slds-text-body_small slds-m-bottom_medium">
                    Panel login uses a Salesforce External Credential for the Panel token. Salesforce API access uses a separate External Client App (ECA).
                    The package assigns its API permission set to each selected user and verifies that each ECA token belongs to this org and Run As user.
                    Add multiple execution users to rotate Conversation Data API requests when a user reaches its per-minute limit. Each ECA has one Run As user.
                </p>
                <template if:true={apiConnectionsError}>
                    <div class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_small" role="alert">
                        <span class="slds-assistive-text">Error</span>
                        <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                            <span>{apiConnectionsError}</span>
                            <lightning-button label="Retry status" variant="neutral" onclick={handleRetryApiConnections}></lightning-button>
                        </div>
                    </div>
                </template>
                <template if:true={apiConnectionSetupError}>
                    <div class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_small" role="alert">
                        <span class="slds-assistive-text">Error</span>
                        <span>{apiConnectionSetupError}</span>
                    </div>
                </template>
                <lightning-combobox label="Messaging Channel" value={selectedChannelId} options={messagingChannelOptions}
                    onchange={handleChannelChange}></lightning-combobox>
                <template if:true={selectedChannelApiConnected}>
                    <div class="slds-m-top_small"><lightning-badge label="Connected to Panel"></lightning-badge></div>
                    <div class="slds-box slds-theme_shade slds-m-top_small">
                        <p class="slds-text-title_bold slds-m-bottom_x-small">Connected execution users</p>
                        <template for:each={selectedChannelExecutionUsers} for:item="executionUser">
                            <div key={executionUser.integrationUserId} class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-p-vertical_xx-small">
                                <span class="slds-text-body_small">{executionUser.integrationUserId}</span>
                                <template if:true={executionUser.isPrimary}>
                                    <lightning-badge label="Primary"></lightning-badge>
                                </template>
                                <template if:false={executionUser.isPrimary}>
                                    <lightning-button-icon icon-name="utility:delete" alternative-text="Remove execution user"
                                        title="Remove execution user" data-user-id={executionUser.integrationUserId}
                                        onclick={handleDisconnectApiExecutionUser} disabled={isApiConnectionBusy}></lightning-button-icon>
                                </template>
                            </div>
                        </template>
                    </div>
                    <lightning-accordion allow-multiple-sections-open class="slds-m-top_small">
                        <lightning-accordion-section name="addExecutionUser" label="Add an execution user">
                            <lightning-input label="Integration user ID" value={apiExecutionIntegrationUserId}
                                onchange={handleApiExecutionIntegrationUserChange}></lightning-input>
                            <lightning-input class="slds-m-top_x-small" label="ECA consumer key" value={apiExecutionClientId}
                                onchange={handleApiExecutionClientIdChange}></lightning-input>
                            <lightning-input class="slds-m-top_x-small" type="password" label="ECA consumer secret"
                                value={apiExecutionClientSecret} onchange={handleApiExecutionClientSecretChange}></lightning-input>
                            <lightning-button class="slds-m-top_small" variant="brand" label="Add execution user"
                                onclick={handleConnectApiExecutionUser} disabled={apiConnectionDisabled}></lightning-button>
                        </lightning-accordion-section>
                    </lightning-accordion>
                    <lightning-button class="slds-m-top_small" variant="destructive" label="Disconnect channel API access"
                        onclick={handleDisconnectApiChannel} disabled={apiConnectionDisabled}></lightning-button>
                    <lightning-button class="slds-m-top_small slds-m-left_x-small" variant="brand-outline" label="View Tool Proxy Endpoints" icon-name="utility:link" onclick={handleFetchToolProxies} disabled={toolProxiesLoading}></lightning-button>
                </template>
                <template if:false={selectedChannelApiConnected}>
                    <template if:true={selectedChannelApiPending}>
                        <p class="slds-m-top_small">API permission setup is pending or registration did not finish. Retry Connect, or cancel this setup.</p>
                        <lightning-button variant="destructive-text" label="Cancel incomplete setup"
                            onclick={handleDisconnectApiChannel} disabled={apiConnectionDisabled}></lightning-button>
                    </template>
                    <lightning-input class="slds-m-top_small" label="Integration user ID" value={apiIntegrationUserId}
                        onchange={handleApiIntegrationUserChange}></lightning-input>
                    <lightning-input label="ECA consumer key" value={apiClientId} onchange={handleApiClientIdChange}></lightning-input>
                    <lightning-input type="password" label="ECA consumer secret" value={apiClientSecret}
                        onchange={handleApiClientSecretChange}></lightning-input>
                    <lightning-button class="slds-m-top_small" variant="brand" label="Connect channel API access"
                        onclick={handleConnectApiChannel} disabled={apiConnectionDisabled}></lightning-button>
                    <p class="slds-text-body_small slds-m-top_x-small">
                        Need an app first? Complete Step 3 of the Setup Wizard tab to create the External Client App, then return here to connect.
                        Never include the consumer secret in support messages.
                    </p>
                </template>
            </article>
        </template>

    </lightning-tab>

    <lightning-tab label="Messaging Backups" value="setup" icon-name="utility:backup">
        <div class="slds-m-top_small">
            <article class="slds-card slds-box slds-theme_default slds-m-bottom_medium">

                <div class="slds-card__body slds-card__body_inner slds-m-top_medium">
                    <!-- Messaging Configuration Backup & Restore Card -->
                    <div class="slds-box slds-box_small slds-theme_default slds-m-bottom_medium slds-border" data-testid="messaging-backups-section">
                        <!-- Card Header -->
                        <div class="slds-page-header slds-page-header_joined slds-theme_shade slds-box_xx-small slds-m-bottom_small">
                            <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                                <div class="slds-media slds-media_center">
                                    <div class="slds-media__figure">
                                        <lightning-icon icon-name="standard:record_create" size="small"></lightning-icon>
                                    </div>
                                    <div class="slds-media__body">
                                        <div class="slds-grid slds-grid_vertical-align-center">
                                            <h3 class="slds-text-title_bold text-gray-800 text-sm slds-m-right_small">
                                                Messaging Configuration Backups &amp; Restore
                                            </h3>
                                            <span class="slds-badge slds-theme_default font-bold text-xs" data-testid="backups-count-badge">
                                                {backupsCountLabel}
                                            </span>
                                        </div>
                                        <p class="slds-text-body_small slds-text-color_weak text-xxs">
                                            Create and inspect snapshots, or restore a previous configuration. Restore requires a connected Salesforce API authorization.
                                        </p>
                                    </div>
                                </div>
                                <div class="slds-grid slds-grid_vertical-align-center">
                                    <lightning-button
                                        variant="brand-outline"
                                        label="Backup Now"
                                        icon-name="utility:save"
                                        onclick={handleOpenManualBackupModal}
                                        disabled={isBackingUpNow}
                                        size="small"
                                        class="slds-m-right_x-small"
                                        data-testid="backup-now-btn">
                                    </lightning-button>
                                    <lightning-button-icon
                                        icon-name="utility:refresh"
                                        alternative-text="Refresh Backups"
                                        onclick={loadBackups}
                                        disabled={isBackupsLoading}
                                        size="small"
                                        data-testid="refresh-backups-btn">
                                    </lightning-button-icon>
                                </div>
                            </div>
                        </div>

                        <template if:true={canManageSelfOrgApi}>
                            <div class="slds-box slds-theme_default slds-m-bottom_small" data-testid="self-org-api-connection">
                                <div class="slds-grid slds-wrap slds-grid_vertical-align-center slds-grid_align-spread">
                                    <div class="slds-m-right_medium slds-m-bottom_x-small">
                                        <div class="slds-grid slds-grid_vertical-align-center">
                                            <span class="slds-text-title_bold slds-m-right_small">Salesforce API connection</span>
                                            <lightning-badge label={selfOrgConnectionStatusLabel} class={selfOrgConnectionStatusClass}></lightning-badge>
                                        </div>
                                        <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">
                                            PKCE authorization lets package API actions run as the Salesforce user who connects this org. No client secret is stored.
                                        </p>
                                        <template if:true={selfOrgConnectionMessage}>
                                            <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">{selfOrgConnectionMessage}</p>
                                        </template>
                                    </div>
                                    <div class="slds-grid slds-grid_vertical-align-center">
                                        <lightning-button
                                            variant="brand"
                                            label={selfOrgApiActionLabel}
                                            onclick={handleConnectSelfOrgApi}
                                            disabled={selfOrgApiActionDisabled}
                                            class="slds-m-right_x-small"
                                            data-testid="connect-self-org-api-btn">
                                        </lightning-button>
                                        <template if:true={selfOrgConnectionConnected}>
                                            <lightning-button
                                                variant="destructive-text"
                                                label="Disconnect"
                                                onclick={handleDisconnectSelfOrgApi}
                                                disabled={selfOrgDisconnectDisabled}
                                                data-testid="disconnect-self-org-api-btn">
                                            </lightning-button>
                                        </template>
                                    </div>
                                </div>
                                <template if:true={selfOrgConnectionError}>
                                    <div class="slds-notify slds-notify_alert slds-alert_error slds-m-top_small" role="alert">
                                        <span class="slds-assistive-text">Error</span>
                                        <span>{selfOrgConnectionError}</span>
                                    </div>
                                </template>
                                <template if:true={showSelfOrgSetupInstructions}>
                                    <lightning-accordion allow-multiple-sections-open class="slds-m-top_small">
                                        <lightning-accordion-section name="selfOrgPkceSetup" label="PKCE setup instructions">
                                            <p class="slds-text-body_small slds-m-bottom_x-small">From the tubot-sf-package folder after installing or deploying the package:</p>
                                            <pre class="slds-box slds-theme_shade slds-text-body_small"><lightning-formatted-text value={selfOrgSetupCommand}></lightning-formatted-text></pre>
                                            <p class="slds-text-body_small slds-m-top_small">The command creates the public External Client App, reads the callback base URL from MCP_Config__c, saves the ECA consumer key, and verifies that setting with Salesforce CLI. It never requests a client secret.</p>
                                            <p class="slds-text-title_bold slds-m-top_small">Manual setup</p>
                                            <ol class="slds-list_ordered slds-m-left_medium slds-text-body_small">
                                                <li>Create a local External Client App with API, OpenID, and Refresh Token scopes.</li>
                                                <li>Enable Authorization Code, require S256 PKCE, allow a missing consumer secret, and disable secret requirements for token exchange and refresh.</li>
                                                <li>Set the callback to the configured Panel base URL followed by <code>/api/v1/salesforce/self-oauth/callback</code>.</li>
                                                <li>Save the app's consumer key in <code>MCP_Config__c.Self_Org_ECA_Client_Id__c</code>.</li>
                                            </ol>
                                        </lightning-accordion-section>
                                    </lightning-accordion>
                                </template>
                            </div>
                        </template>

                        <!-- Backups Table / Spinner / Empty State -->
                        <template if:true={isBackupsLoading}>
                            <div class="slds-p-around_medium slds-text-align_center">
                                <lightning-spinner alternative-text="Loading Backups" size="small" variant="brand"></lightning-spinner>
                                <div class="text-xs text-gray-500 slds-m-top_small">Loading messaging backups...</div>
                            </div>
                        </template>

                        <template if:false={isBackupsLoading}>
                            <template if:true={hasBackups}>
                                <div class="slds-scrollable_x" style="max-height: 280px; overflow-y: auto;">
                                    <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_col-bordered text-xs" data-testid="backups-table">
                                        <thead>
                                            <tr class="slds-line-height_reset bg-gray-50">
                                                <th scope="col" style="width: 14%;"><div class="slds-truncate font-semibold">Reference / Name</div></th>
                                                <th scope="col" style="width: 14%;"><div class="slds-truncate font-semibold">Trigger Type</div></th>
                                                <th scope="col" style="width: 16%;"><div class="slds-truncate font-semibold">Deployment</div></th>
                                                <th scope="col" style="width: 16%;"><div class="slds-truncate font-semibold">Captured At</div></th>
                                                <th scope="col" style="width: 24%;"><div class="slds-truncate font-semibold">Items Snapshot</div></th>
                                                <th scope="col" style="width: 8%;"><div class="slds-truncate font-semibold">Status</div></th>
                                                <th scope="col" style="width: 8%;"><div class="slds-truncate font-semibold slds-text-align_right">Actions</div></th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template for:each={backupsList} for:item="bk">
                                                <tr key={bk.id} class="slds-hint-parent" data-testid={bk.name}>
                                                    <td>
                                                        <div class="font-mono font-bold text-indigo-700">{bk.name}</div>
                                                        <div class="text-xxs text-gray-500 truncate" title={bk.backupName}>{bk.backupName}</div>
                                                    </td>
                                                    <td>
                                                        <span class={bk.triggerBadgeClass}>{bk.triggerType}</span>
                                                    </td>
                                                    <td>
                                                        <div class="font-semibold text-gray-800 truncate" title={bk.deploymentName}>{bk.deploymentName}</div>
                                                    </td>
                                                    <td class="text-gray-600 font-mono text-xxs">
                                                        {bk.createdDate}
                                                    </td>
                                                    <td class="text-gray-700 text-xxs" title={bk.itemSummary}>
                                                        {bk.itemSummary}
                                                    </td>
                                                    <td>
                                                        <span class={bk.statusBadgeClass}>{bk.status}</span>
                                                        <template if:true={bk.isRestored}>
                                                            <div class="text-xxs text-emerald-700 truncate" title={bk.restoredAt}>Restored: {bk.restoredAt}</div>
                                                        </template>
                                                    </td>
                                                    <td class="slds-text-align_right">
                                                        <div class="slds-grid slds-grid_align-end">
                                                            <lightning-button
                                                                variant="brand-outline"
                                                                label="Restore"
                                                                icon-name="utility:undo"
                                                                size="x-small"
                                                                data-id={bk.id}
                                                                onclick={handleOpenRestoreModal}
                                                                disabled={isRestoring}
                                                                class="slds-m-right_xx-small"
                                                                data-testid="restore-btn">
                                                            </lightning-button>
                                                            <lightning-button-icon
                                                                icon-name="utility:preview"
                                                                alternative-text="View Details"
                                                                size="small"
                                                                data-id={bk.id}
                                                                onclick={handleOpenDetailsModal}
                                                                class="slds-m-right_xx-small"
                                                                data-testid="view-backup-btn">
                                                            </lightning-button-icon>
                                                            <lightning-button-icon
                                                                icon-name="utility:delete"
                                                                alternative-text="Delete Backup"
                                                                variant="border-filled"
                                                                size="small"
                                                                data-id={bk.id}
                                                                onclick={handleDeleteBackup}
                                                                data-testid="delete-backup-btn">
                                                            </lightning-button-icon>
                                                        </div>
                                                    </td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </div>
                            </template>

                            <template if:false={hasBackups}>
                                <div class="slds-box slds-theme_shade slds-text-align_center slds-p-around_medium text-xs text-gray-500" data-testid="no-backups-msg">
                                    <lightning-icon icon-name="utility:backup" size="small" class="slds-m-bottom_x-small"></lightning-icon>
                                    <p class="font-semibold text-gray-700">No messaging backups found.</p>
                                    <p class="text-xxs text-gray-500">
                                        Click "Backup Now" to capture the current state.
                                    </p>
                                </div>
                            </template>
                        </template>
                    </div>

                    <!-- Tooling API Setup Log Console -->
                </div>
            </article>
        </div>
    </lightning-tab>
</lightning-tabset>

    <!-- Restore Confirmation Modal -->
    <template if:true={isRestoreModalOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_small" aria-modal="true" data-testid="restore-modal">
            <div class="slds-modal__container">
                <header class="slds-modal__header bg-amber-50" style="border-bottom: 2px solid #f59e0b;">
                    <button class="slds-button slds-button_icon slds-modal__close" title="Close" onclick={handleCloseRestoreModal} disabled={isRestoring}>
                        <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <div class="slds-media slds-media_center">
                        <div class="slds-media__figure">
                            <lightning-icon icon-name="utility:undo" size="medium" variant="warning"></lightning-icon>
                        </div>
                        <div class="slds-media__body">
                            <h2 class="slds-modal__title slds-hyphenate slds-text-heading_medium font-bold text-gray-900">
                                Restore Messaging Configuration
                            </h2>
                            <p class="slds-text-body_small slds-text-color_weak slds-m-top_xxx-small">
                                Backup: <strong>{selectedBackupForRestore.name}</strong> &bull; Trigger: <strong>{selectedBackupForRestore.triggerType}</strong> &bull; Created: {selectedBackupForRestore.createdDate}
                            </p>
                        </div>
                    </div>
                </header>

                <div class="slds-modal__content slds-p-around_medium">
                    <div class="slds-box bg-amber-100 slds-border slds-m-bottom_medium text-amber-900" style="border-color: #f59e0b;">
