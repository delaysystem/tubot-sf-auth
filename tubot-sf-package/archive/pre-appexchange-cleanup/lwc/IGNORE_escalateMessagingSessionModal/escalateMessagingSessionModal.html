<template>
    <lightning-quick-action-panel header="Escalate to Human Agent">
        <template if:true={isSaving}>
            <lightning-spinner alternative-text="Escalating Session..." size="medium"></lightning-spinner>
        </template>

        <!-- Informational Banner -->
        <div class="slds-notify slds-notify_alert slds-alert_info slds-m-bottom_medium" role="alert">
            <lightning-icon icon-name="utility:info" size="x-small" class="slds-m-right_x-small"></lightning-icon>
            <h2>All escalation details below are completely optional. Submitting updates this session record and triggers automated Omnichannel routing.</h2>
        </div>

        <div class="slds-form slds-form_stacked">
            <!-- Escalate To Human Flag -->
            <div class="slds-form-element slds-m-bottom_small">
                <lightning-input 
                    type="checkbox" 
                    label="Escalate To Human (Escalate_To_Human__c)" 
                    checked 
                    disabled>
                </lightning-input>
                <div class="slds-text-color_weak slds-text-body_small slds-m-top_xxx-small">
                    Automatically set to true to flag this session for human agent pickup.
                </div>
            </div>

            <!-- Escalation Reason -->
            <div class="slds-form-element slds-m-bottom_small">
                <lightning-input 
                    label="Escalation Reason (Optional)" 
                    value={reason} 
                    onchange={handleReasonChange}
                    placeholder="e.g. Customer requested human agent, complex technical query, or billing dispute">
                </lightning-input>
                <div class="slds-text-color_weak slds-text-body_small slds-m-top_xxx-small">
                    Stored in <code>Escalation_Reason__c</code>.
                </div>
            </div>

            <!-- AI Conversation Summary -->
            <div class="slds-form-element slds-m-bottom_small">
                <lightning-textarea 
                    label="AI Conversation Summary (Optional)" 
                    value={summary} 
                    onchange={handleSummaryChange}
                    rows="3"
                    placeholder="e.g. Customer inquired about board specs and pricing; AI provided datasheet but human assistance requested.">
                </lightning-textarea>
                <div class="slds-text-color_weak slds-text-body_small slds-m-top_xxx-small">
                    Stored in <code>AI_Conversation_Summary__c</code> to give the human agent immediate context.
                </div>
            </div>

            <!-- Routing Configuration Section -->
            <div class="slds-box slds-box_small slds-theme_shade slds-m-bottom_small" style="border-left: 3px solid #6366f1;">
                <h3 class="slds-text-title_bold slds-m-bottom_xx-small" style="color: #312e81;">
                    Omni-Channel Routing Parameters (Optional)
                </h3>
                <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_small">
                    Specify direct queue, routing config, or skill parameters below. <strong>If all 4 are left empty, the fallback queue from Tubot Settings (<code>{fallbackQueueDisplay}</code>) will be automatically applied.</strong>
                </p>

                <div class="slds-grid slds-gutters slds-wrap">
                    <!-- varTargetQueueName -->
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-bottom_small">
                        <lightning-input 
                            type="text" 
                            label="Target Queue Name (varTargetQueueName)" 
                            value={varTargetQueueName} 
                            onchange={handleTargetQueueChange}
                            placeholder={queuePlaceholder}>
                        </lightning-input>
                        <div class="slds-text-color_weak slds-text-body_small slds-m-top_xxx-small">
                            Stored in <code>varTargetQueueName__c</code>
                        </div>
                    </div>

                    <!-- varRouting -->
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-bottom_small">
                        <lightning-input 
                            type="text" 
                            label="Routing Config (varRouting)" 
                            value={varRouting} 
                            onchange={handleRoutingChange}
                            placeholder="e.g. Chat_Routing_Config">
                        </lightning-input>
                        <div class="slds-text-color_weak slds-text-body_small slds-m-top_xxx-small">
                            Stored in <code>varRouting__c</code>
                        </div>
                    </div>

                    <!-- varSkillLevel -->
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-bottom_small">
                        <lightning-input 
                            type="number" 
                            step="0.01" 
                            min="0" 
                            label="Skill Level (varSkillLevel)" 
                            value={varSkillLevel} 
                            onchange={handleSkillLevelChange}
                            placeholder="e.g. 1.0 or 2.5">
                        </lightning-input>
                        <div class="slds-text-color_weak slds-text-body_small slds-m-top_xxx-small">
                            Stored in <code>varSkillLevel__c</code>
                        </div>
                    </div>

                    <!-- varTargetSkillName -->
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-bottom_small">
                        <lightning-input 
                            type="text" 
                            label="Target Skill Name (varTargetSkillName)" 
                            value={varTargetSkillName} 
                            onchange={handleTargetSkillChange}
                            placeholder="e.g. Technical_Support or English">
                        </lightning-input>
                        <div class="slds-text-color_weak slds-text-body_small slds-m-top_xxx-small">
                            Stored in <code>varTargetSkillName__c</code>
                        </div>
                    </div>

                    <!-- varFlowHuman -->
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-bottom_small">
                        <lightning-input 
                            type="text" 
                            label="Target Human Flow (varFlowHuman)" 
                            value={varFlowHuman} 
                            onchange={handleFlowHumanChange}
                            placeholder="e.g. OmniMessagingRoutingFlow">
                        </lightning-input>
                        <div class="slds-text-color_weak slds-text-body_small slds-m-top_xxx-small">
                            Stored in <code>varFlowHuman__c</code>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div slot="footer">
            <lightning-button 
                label="Cancel" 
                variant="neutral" 
                onclick={handleClose} 
                disabled={isSaving}
                class="slds-m-right_x-small">
            </lightning-button>
            <lightning-button 
                label="Escalate to Human" 
                variant="brand" 
                icon-name="utility:forward" 
                onclick={handleEscalate} 
                disabled={isSaving}>
            </lightning-button>
        </div>
    </lightning-quick-action-panel>
</template>
